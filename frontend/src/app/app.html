<header class="shell-header">
  <a class="brand" routerLink="/">🎵 GigDrive</a>
  <nav>
    <a routerLink="/concerts" routerLinkActive="active">Concerts</a>
    <a routerLink="/trips" routerLinkActive="active">Trips</a>
    @if (authService.currentUser(); as user) {
      <a routerLink="/dashboard/driver" routerLinkActive="active">Driver</a>
      <a routerLink="/dashboard/passenger" routerLinkActive="active">Passenger</a>
      <a routerLink="/profile" routerLinkActive="active">Profile</a>
      <span class="user-name">{{ user.firstName }}</span>
      <button type="button" class="logout" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/auth/login" routerLinkActive="active">Log in</a>
      <a routerLink="/auth/register" routerLinkActive="active">Register</a>
    }
  </nav>
</header>

<main class="shell-content">
  <router-outlet />
</main>
