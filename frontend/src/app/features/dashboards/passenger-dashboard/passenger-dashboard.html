<div class="dashboard">
  <header class="dash-header">
    <h1>Passenger dashboard</h1>
    <a routerLink="/dashboard/driver">Driver dashboard</a>
  </header>

  @if (loading()) {
    <p class="state">Loading bookings…</p>
  } @else {
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    @if (reviewError()) {
      <p class="error" role="alert">{{ reviewError() }}</p>
    }

    <app-booking-list
      [bookings]="bookings()"
      mode="passenger"
      [pendingId]="pendingId()"
      [reviewPendingTripId]="reviewPendingTripId()"
      emptyMessage="You have no bookings yet."
      (cancel)="cancel($event)"
      (review)="submitReview($event)"
    />

    <section class="waitlist">
      <h2>Waitlist</h2>
      @if (waitlistError()) {
        <p class="error" role="alert">{{ waitlistError() }}</p>
      }
      @if (waitlistLoading()) {
        <p class="state">Loading waitlist…</p>
      } @else {
        <app-waitlist-list
          [entries]="waitlistEntries()"
          [pendingTripId]="waitlistPendingTripId()"
          (leave)="leaveWaitlist($event)"
        />
      }
    </section>
  }
</div>
