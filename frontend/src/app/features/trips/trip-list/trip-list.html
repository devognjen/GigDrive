<div class="trip-list">
  <header class="trips-header mb-6 flex flex-col gap-3 sm:flex-row sm:items-baseline sm:justify-between">
    <h1 class="m-0">{{ concertId() ? 'Trips to this concert' : 'Shared rides' }}</h1>
    <a
      class="new-trip btn btn-primary no-underline"
      routerLink="/trips/new"
      [queryParams]="concertId() ? { concertId: concertId() } : {}"
    >
      Offer a ride
    </a>
  </header>

  <form class="filters grid grid-cols-1 gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-6" [formGroup]="filters">
    <div class="field">
      <label for="from">Departure</label>
      <input id="from" type="text" formControlName="from" placeholder="City" autocomplete="off" />
    </div>

    <div class="field">
      <label for="vehicleType">Vehicle</label>
      <select id="vehicleType" formControlName="vehicleType">
        @for (option of vehicleTypeOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label for="maxPrice">Max price (€)</label>
      <input id="maxPrice" type="number" min="0" formControlName="maxPrice" />
    </div>

    <div class="field">
      <label for="minRating">Min rating</label>
      <input id="minRating" type="number" min="1" max="5" formControlName="minRating" />
    </div>

    <div class="field">
      <label for="seatsMin">Seats left</label>
      <input id="seatsMin" type="number" min="0" formControlName="seatsMin" />
    </div>

    <div class="field">
      <label for="sort">Sort</label>
      <select id="sort" formControlName="sort">
        <option value="soonest">Soonest</option>
        <option value="cheapest">Cheapest</option>
        <option value="likely">Most likely to happen</option>
      </select>
    </div>
  </form>

  @if (loading()) {
    <p class="state mt-6">Loading rides…</p>
  } @else if (trips().length === 0) {
    <p class="state mt-6">No rides match your filters.</p>
  } @else {
    <ul class="trips mt-6 m-0 grid list-none grid-cols-1 gap-4 p-0 sm:grid-cols-2 lg:grid-cols-3">
      @for (trip of trips(); track trip.id) {
        <li>
          <app-trip-card [trip]="trip" />
        </li>
      }
    </ul>
  }
</div>
