server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve upstreams at request time (survives backend container
  # recreation). ${NGINX_RESOLVER} is set by docker-entrypoint.sh from the
  # container's own resolver (127.0.0.11 on Docker, aardvark-dns on Podman).
  resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

  # API requests are proxied to the NestJS backend (global prefix /api).
  location /api/ {
    set $api_upstream http://backend:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: let the Angular router handle unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
